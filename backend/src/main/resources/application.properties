spring.application.name=norte-app

# H2 em arquivo local (persiste entre execucoes). Troque para Postgres/MySQL em producao.
spring.datasource.url=jdbc:h2:file:./data/norte;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080

# Chave da API da Groq (gratuita) - crie em https://console.groq.com/keys
groq.api.key=${GROQ_API_KEY:}
# openai/gpt-oss-120b: modelo de raciocinio de verdade (nao so um chat model rapido),
# com "esforco de raciocinio" configuravel. Mais lento que llama-3.3-70b, mas muito mais
# consistente em tarefas com nuance (like refinar uma recomendacao com base num comentario).
# Verifique os limites atuais do tier gratuito em https://console.groq.com/docs/models
groq.api.model=openai/gpt-oss-120b
groq.api.reasoning-effort=medium
groq.api.url=https://api.groq.com/openai/v1/chat/completions
